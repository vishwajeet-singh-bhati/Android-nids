[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-scam-detector"
version = "0.1.0"
description = "Explainable, on-device SMS ham/spam/smishing detector (baseline pipeline)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bharat AI 2026 SMS module" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
report = ["matplotlib>=3.8"]
data = ["requests>=2.31"]

[project.scripts]
sms-detect = "sms_detection.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sms_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
