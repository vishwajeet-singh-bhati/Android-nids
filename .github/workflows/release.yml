name: Release APK
# Push a tag such as v1.0.0 (or run manually) to publish an installable APK
# on the repository's Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        run: python reproduce.py build-android --sdk "$ANDROID_HOME"
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Rakshak.apk && sha256sum Rakshak.apk > Rakshak.apk.sha256
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Rakshak ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            Rakshak.apk
            Rakshak.apk.sha256
          body: |
            **Rakshak** – on-device detection of network intrusions, SMS scams and phishing links.

            **Install:** download `Rakshak.apk` on an Android 8.0+ phone, allow "Install unknown apps", open it.
            Then enable *Automatically check incoming SMS and links* and grant SMS + notification permissions.

            - SMS and link checks work on any phone; network monitoring needs a rooted test phone (see docs/ANDROID_SETUP.md).
            - The optional Llama explanation model (1.06 GiB) is installed separately; the app works without it.
            - This is a debug-signed research build. Verify the download against `Rakshak.apk.sha256`.
